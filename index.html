<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <!--
      PWA instalable (issue #43): manifest + iconos con rutas RELATIVAS
      (el deploy vive en el subpath /formulita/ de GitHub Pages) y metas
      de iOS para que "Agregar a pantalla de inicio" abra standalone.
      El registro del service worker vive en src/pwa (solo producción).
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Formulita" />
    <title>Formulita</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        /* Bloquea gestos del navegador: scroll, zoom, double-tap. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        /* Sin menú emergente de iOS al long-press (complementa el
         * bloqueo de contextmenu/selectstart en src/main.ts). */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /*
       * Contenedor del canvas. Usa los safe areas del notch como paddings
       * (env(safe-area-inset-*)), de modo que Phaser (Scale.FIT) escala el
       * canvas dentro del área útil de la pantalla, sin tocar la notch.
       */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
