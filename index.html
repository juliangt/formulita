<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Formulita</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        /* Bloquea gestos del navegador: scroll, zoom, double-tap. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        /* Sin menú emergente de iOS al long-press (complementa el
         * bloqueo de contextmenu/selectstart en src/main.ts). */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      /*
       * Contenedor del canvas. Usa los safe areas del notch como paddings
       * (env(safe-area-inset-*)), de modo que Phaser (Scale.FIT) escala el
       * canvas dentro del área útil de la pantalla, sin tocar la notch.
       */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      /*
       * Telemetría PostHog Cloud EU (issue #27) — analítica cookieless.
       *
       * - Cookieless 'always': PostHog identifica cada evento con un hash
       *   server-side IRREVERSIBLE con sal diaria. No escribe cookies ni
       *   localStorage/sessionStorage ⇒ cero storage en el dispositivo y sin
       *   banner de consentimiento.
       * - Cloud EU: API y assets en la UE (eu.i.posthog.com / eu-assets...).
       * - person_profiles: 'never' y sin identify ni alias de por vida (ver
       *   src/telemetry/analytics.ts): nadie puede asociar los eventos a una
       *   identidad persistente — eso anularía el beneficio cookieless.
       * - Sin PII: los ganchos de juego (otra fase) solo mandan eventos
       *   agregados/anónimos vía src/telemetry/analytics.ts.
       *
       * Carga NO bloqueante y diferida para no competir con el arranque del
       * juego: el script del CDN se inyecta async recién cuando el navegador
       * queda idle (requestIdleCallback con timeout generoso; en su defecto,
       * window load + setTimeout).
       *
       * En `npm run dev` (y preview local) esto NO carga NADA por DOS vías
       * independientes: (1) el gate por hostname de abajo (localhost,
       * 127.0.0.1, [::1], hostname vacío) y (2) el token placeholder vacío.
       * Con el token vacío tampoco se carga nada en producción: evita pings
       * 404 hasta pegar el real.
       *
       * PASO MANUAL (issue #27): crear el proyecto en https://eu.posthog.com
       * con "Cookieless server hash mode" activado y pegar acá su Project API
       * token. El token es público por diseño (viaja en este HTML estático).
       */
      (function () {
        'use strict';

        /** ← Pegá acá el Project API token del proyecto PostHog EU (vacío = no cargar nada). */
        var POSTHOG_TOKEN = '';

        // Gate por hostname: cero telemetría en desarrollo local. El hostname
        // vacío cubre file:// y contextos sin origen.
        var hostname = window.location.hostname;
        if (
          hostname === '' ||
          hostname === 'localhost' ||
          hostname === '127.0.0.1' ||
          hostname === '[::1]' ||
          hostname === '::1'
        ) {
          return;
        }

        // Token placeholder sin completar: no se pide ni un byte del SDK.
        if (!POSTHOG_TOKEN) {
          return;
        }

        function initPostHog() {
          try {
            if (window.posthog && typeof window.posthog.init === 'function') {
              window.posthog.init(POSTHOG_TOKEN, {
                api_host: 'https://eu.i.posthog.com',
                cookieless_mode: 'always',
                person_profiles: 'never',
                autocapture: false,
                capture_pageview: true,
                // Snapshot de defaults SDK vigente de posthog-js: el más
                // nuevo documentado en posthog.com/docs/libraries/js/config
                // (verificado contra el tipo ConfigDefaults de posthog-js).
                defaults: '2026-08-30',
              });
            }
          } catch (e) {
            /* La telemetría no puede romper el juego. Nunca. */
          }
        }

        function loadPostHog() {
          try {
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://eu-assets.i.posthog.com/static/array.js';
            script.onload = initPostHog;
            (document.body || document.head).appendChild(script);
          } catch (e) {
            /* Ídem: si no se puede inyectar el script, no pasa nada. */
          }
        }

        // Diferido real: idle del navegador con techo generoso; si no hay
        // requestIdleCallback (Safari viejo), window load + setTimeout.
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadPostHog, { timeout: 8000 });
        } else if (document.readyState === 'complete') {
          window.setTimeout(loadPostHog, 0);
        } else {
          window.addEventListener('load', function () {
            window.setTimeout(loadPostHog, 0);
          });
        }
      })();
    </script>
  </body>
</html>
